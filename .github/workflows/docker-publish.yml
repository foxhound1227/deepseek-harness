name: Daily Build and Publish

on:
  schedule:
    # 0:00 UTC is 8:00 AM Beijing time
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  # Use your repository name as the image name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: upstream-src

      - name: Checkout our configuration
        uses: actions/checkout@v4
        with:
          path: my-config

      - name: Prepare build context
        run: |
          cp my-config/Dockerfile upstream-src/
          cp my-config/.dockerignore upstream-src/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./upstream-src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
